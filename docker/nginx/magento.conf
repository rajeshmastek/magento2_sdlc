server {
    listen 80;
    server_name _;

    root /var/www/html/pub;
    index index.php;

    client_max_body_size 50M;
    client_body_timeout 120s;
    send_timeout 120s;

    # Magento health check endpoint
    location = /health {
        alias /var/www/html/pub/health.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/pub/health.php;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ ^/setup {
        root /var/www/html;
        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    location /media {
        try_files $uri $uri/ /get.php?$args;
        add_header X-Frame-Options "SAMEORIGIN";
        expires 365d;
    }

    location /static {
        expires 365d;
        add_header Cache-Control "public";
        if (!-f $request_filename) {
            rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
        }
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_FLAG "session.auto_start=off\nsuhosin.session.cryptua=off";
        fastcgi_param PHP_VALUE "max_execution_time=600\nmemory_limit=512M";
        fastcgi_read_timeout 600s;
        fastcgi_connect_timeout 600s;
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/(app|bin|dev|lib|phpserver|var|vendor)/ {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
