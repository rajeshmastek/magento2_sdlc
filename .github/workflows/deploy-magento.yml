name: Build and Deploy Magento 2.4.9

on:
  push:
    branches: [develop, main]
    paths:
      - 'app/code/**'
      - 'composer.json'
      - 'composer.lock'
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/deploy-magento.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [staging, production]
        default: staging
      skip_tests:
        description: 'Skip smoke tests'
        type: boolean
        default: false

env:
  ECR_REPOSITORY: magento24-app
  CONTAINER_NAME: magento
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Resolve infrastructure names ──────────────────────────────────────
  resolve-infra:
    name: Resolve Infrastructure
    runs-on: ubuntu-latest
    outputs:
      cluster:      ${{ steps.infra.outputs.cluster }}
      service:      ${{ steps.infra.outputs.service }}
      task_family:  ${{ steps.infra.outputs.task_family }}
      magento_url:  ${{ steps.infra.outputs.magento_url }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Resolve from AWS
        id: infra
        run: |
          # Magento URL
          MAGENTO_URL=$(aws ssm get-parameter \
            --name "/magento/prod/base_url" --with-decryption \
            --query "Parameter.Value" --output text 2>/dev/null \
            || echo "${{ secrets.MAGENTO_BASE_URL }}")
          echo "magento_url=${MAGENTO_URL}" >> $GITHUB_OUTPUT
          echo "URL: ${MAGENTO_URL}"

          # ECS cluster
          CLUSTER_ARN=$(aws ecs list-clusters \
            --query "clusterArns[?contains(@,'magento')]|[0]" \
            --output text 2>/dev/null)
          if [ -z "$CLUSTER_ARN" ] || [ "$CLUSTER_ARN" = "None" ]; then
            CLUSTER="${{ secrets.ECS_CLUSTER }}"
          else
            CLUSTER=$(aws ecs describe-clusters --clusters "$CLUSTER_ARN" \
              --query "clusters[0].clusterName" --output text)
          fi
          echo "cluster=${CLUSTER}" >> $GITHUB_OUTPUT
          echo "Cluster: ${CLUSTER}"

          # ECS service
          SERVICE_ARN=$(aws ecs list-services --cluster "$CLUSTER" \
            --query "serviceArns[?contains(@,'magento')]|[0]" \
            --output text 2>/dev/null)
          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            SERVICE="${{ secrets.ECS_SERVICE }}"
          else
            SERVICE=$(aws ecs describe-services --cluster "$CLUSTER" \
              --services "$SERVICE_ARN" \
              --query "services[0].serviceName" --output text)
          fi
          echo "service=${SERVICE}" >> $GITHUB_OUTPUT
          echo "Service: ${SERVICE}"

          # Task definition family
          TASK_ARN=$(aws ecs list-task-definitions \
            --family-prefix "magento" --sort DESC --max-items 1 \
            --query "taskDefinitionArns[0]" --output text 2>/dev/null)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            FAMILY="${{ secrets.ECS_TASK_FAMILY }}"
          else
            FAMILY=$(echo "$TASK_ARN" | sed 's|.*/\(.*\):.*|\1|')
          fi
          echo "task_family=${FAMILY}" >> $GITHUB_OUTPUT
          echo "Task family: ${FAMILY}"

  # ── 2. Build and push image ───────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: resolve-infra
    outputs:
      image:   ${{ steps.set-image.outputs.image }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          VERSION="${{ github.ref_name }}-$(git rev-parse --short HEAD)-$(date +%Y%m%d%H%M%S)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context:   .
          file:      ./Dockerfile
          push:      true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            MAGENTO_VERSION=2.4.9
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to:   type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Set image output
        id: set-image
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "Image: ${IMAGE}"

  # ── 3. Update ECS task definition with all Magento env vars ──────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [resolve-infra, build]
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url:  ${{ needs.resolve-infra.outputs.magento_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.ECS_TASK_FAMILY }}" \
            --query taskDefinition > task-definition.json
          echo "Task def: $(python3 -c "import json,sys; d=json.load(open('task-definition.json')); print(d['family']+':'+str(d['revision']))")"

      - name: Inject new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ needs.build.outputs.image }}
          environment-variables: |
            MAGENTO_BASE_URL=${{ secrets.MAGENTO_BASE_URL }}/
            MAGENTO_DB_HOST=${{ secrets.MAGENTO_DB_HOST }}
            MAGENTO_DB_NAME=${{ secrets.MAGENTO_DB_NAME }}
            MAGENTO_DB_USER=${{ secrets.MAGENTO_DB_USER }}
            MAGENTO_DB_PASS=${{ secrets.MAGENTO_DB_PASS }}
            MAGENTO_ADMIN_USER=${{ secrets.MAGENTO_ADMIN_USER }}
            MAGENTO_ADMIN_PASS=${{ secrets.MAGENTO_ADMIN_PASS }}
            MAGENTO_ADMIN_EMAIL=${{ secrets.MAGENTO_ADMIN_EMAIL }}
            MAGENTO_REDIS_HOST=${{ secrets.MAGENTO_REDIS_HOST }}
            MAGENTO_ES_HOST=${{ secrets.MAGENTO_ES_HOST }}
            MAGENTO_ES_PORT=9200
            INSTALL_SAMPLE_DATA=${{ secrets.INSTALL_SAMPLE_DATA || 'false' }}
            MAGENTO_SESSION_SAVE=${{ secrets.MAGENTO_SESSION_SAVE || 'db' }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    ${{ secrets.ECS_SERVICE }}
          cluster:                    ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes:           30

      - name: Wait for Magento setup:install to complete
        run: |
          URL="${{ secrets.MAGENTO_BASE_URL }}"
          echo "Polling ${URL}/health — setup:install runs on first boot (~5-10 min)..."
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 --max-time 15 "${URL}/health" 2>/dev/null || echo "000")
            echo "  [${i}/40] HTTP ${STATUS} ($(date +%H:%M:%S))"
            if [ "$STATUS" = "200" ]; then
              echo "Magento is live at ${URL}"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::Health check timed out — check ECS logs"

      - name: Store version in SSM
        if: always()
        run: |
          aws ssm put-parameter \
            --name "/magento/prod/deployed_version" \
            --value "${{ needs.build.outputs.version }}" \
            --type String --overwrite || true

      - name: Deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## Magento 2.4.9 Deployment
          | | |
          |---|---|
          | Version | ${{ needs.build.outputs.version }} |
          | URL | ${{ secrets.MAGENTO_BASE_URL }} |
          | Cluster | ${{ secrets.ECS_CLUSTER }} |
          | Service | ${{ secrets.ECS_SERVICE }} |
          | Commit | ${{ github.sha }} |
          SUMMARY

  # ── 4. Playwright smoke tests ─────────────────────────────────────────────
  smoke-test:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    needs: [resolve-infra, deploy]
    if: ${{ !inputs.skip_tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playwright/package-lock.json

      - name: Install Playwright
        working-directory: playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Run smoke tests
        working-directory: playwright
        env:
          BASE_URL:               ${{ secrets.MAGENTO_BASE_URL }}
          MAGENTO_ADMIN_USER:     ${{ secrets.MAGENTO_ADMIN_USER }}
          MAGENTO_ADMIN_PASS:     ${{ secrets.MAGENTO_ADMIN_PASS }}
          MAGENTO_CUSTOMER_EMAIL: ${{ secrets.MAGENTO_CUSTOMER_EMAIL }}
          MAGENTO_CUSTOMER_PASS:  ${{ secrets.MAGENTO_CUSTOMER_PASS }}
          CI: 'true'
        run: npx playwright test --grep "@smoke" || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.run_id }}
          path: playwright/playwright-report/
          retention-days: 14
