name: Build and Deploy Magento 2.4.9

on:
  push:
    branches: [develop, main]
    paths:
      - 'app/code/**'
      - 'composer.json'
      - 'composer.lock'
      - 'Dockerfile'
      - '.github/workflows/deploy-magento.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target environment'
        type: choice
        options: [staging, production]
        default: staging
      skip_tests:
        description: 'Skip Playwright smoke tests after deploy'
        type: boolean
        default: false

env:
  AWS_REGION:      ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY:  magento24-app
  CONTAINER_NAME:  magento

jobs:
  # ── 1. Resolve real cluster/service names from Terraform outputs ──────────
  resolve-infra:
    name: Resolve Infrastructure Names
    runs-on: ubuntu-latest
    outputs:
      cluster:      ${{ steps.infra.outputs.cluster }}
      service:      ${{ steps.infra.outputs.service }}
      task_family:  ${{ steps.infra.outputs.task_family }}
      magento_url:  ${{ steps.infra.outputs.magento_url }}
      ecr_registry: ${{ steps.infra.outputs.ecr_registry }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Resolve cluster, service and URL from SSM / ECS
        id: infra
        run: |
          # Get Magento URL from SSM (set by Terraform)
          MAGENTO_URL=$(aws ssm get-parameter \
            --name "/magento/prod/base_url" \
            --with-decryption \
            --query "Parameter.Value" --output text 2>/dev/null \
            || echo "${{ secrets.MAGENTO_BASE_URL }}")
          echo "magento_url=${MAGENTO_URL}" >> $GITHUB_OUTPUT
          echo "Magento URL: ${MAGENTO_URL}"

          # Find ECS cluster by tag or name pattern
          CLUSTER=$(aws ecs list-clusters --region ${{ env.AWS_REGION }} \
            --query "clusterArns[?contains(@, 'magento')]" \
            --output text | head -1 | xargs -I{} aws ecs describe-clusters \
            --clusters {} --query "clusters[0].clusterName" --output text 2>/dev/null \
            || echo "${{ secrets.ECS_CLUSTER || 'magento-staging-cluster' }}")
          echo "cluster=${CLUSTER}" >> $GITHUB_OUTPUT
          echo "Cluster: ${CLUSTER}"

          # Find ECS service in that cluster
          SERVICE=$(aws ecs list-services \
            --cluster "${CLUSTER}" --region ${{ env.AWS_REGION }} \
            --query "serviceArns[?contains(@, 'magento')]" --output text | head -1 \
            | xargs -I{} aws ecs describe-services --cluster "${CLUSTER}" \
            --services {} --query "services[0].serviceName" --output text 2>/dev/null \
            || echo "${{ secrets.ECS_SERVICE || 'magento-staging-service' }}")
          echo "service=${SERVICE}" >> $GITHUB_OUTPUT
          echo "Service: ${SERVICE}"

          # Find task definition family
          TASK_FAMILY=$(aws ecs list-task-definitions \
            --family-prefix "magento" --sort DESC --max-items 1 \
            --query "taskDefinitionArns[0]" --output text 2>/dev/null \
            | sed 's|.*/\(.*\):.*|\1|')
          echo "task_family=${TASK_FAMILY:-magento-staging-task}" >> $GITHUB_OUTPUT
          echo "Task family: ${TASK_FAMILY}"

          # ECR registry
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ecr_registry=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

  # ── 2. Build and push Docker image ───────────────────────────────────────
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: resolve-infra
    outputs:
      image:   ${{ steps.build-push.outputs.image }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version tag
        id: version
        run: |
          VERSION="${{ github.ref_name }}-$(git rev-parse --short HEAD)-$(date +%Y%m%d%H%M%S)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Install Magento Composer dependencies
        run: |
          if [ -f "composer.json" ] && [ ! -d "vendor" ]; then
            echo "Installing Composer dependencies..."
            # Set Magento marketplace credentials if provided
            if [ -n "${{ secrets.MAGENTO_PUBLIC_KEY }}" ]; then
              composer config --global http-basic.repo.magento.com \
                "${{ secrets.MAGENTO_PUBLIC_KEY }}" \
                "${{ secrets.MAGENTO_PRIVATE_KEY }}"
            fi
            composer install --no-dev --optimize-autoloader --no-interaction
          else
            echo "vendor/ exists or no composer.json — skipping install"
          fi

      - name: Build and push image to ECR
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file:    ./Dockerfile
          push:    true
          platforms: linux/amd64
          tags: |
            ${{ needs.resolve-infra.outputs.ecr_registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}
            ${{ needs.resolve-infra.outputs.ecr_registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}-latest
            ${{ needs.resolve-infra.outputs.ecr_registry }}/${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            MAGENTO_VERSION=2.4.9
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to:   type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Docker layer cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Set image output
        id: image-out
        run: |
          IMAGE="${{ needs.resolve-infra.outputs.ecr_registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

  # ── 3. Deploy to ECS ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: [resolve-infra, build]
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url:  ${{ needs.resolve-infra.outputs.magento_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ needs.resolve-infra.outputs.task_family }}" \
            --query taskDefinition \
            > task-definition.json
          echo "Task definition fetched: $(cat task-definition.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['family']+':'+str(d['revision']))")"

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ needs.build.outputs.image }}

      - name: Deploy updated task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    ${{ needs.resolve-infra.outputs.service }}
          cluster:                    ${{ needs.resolve-infra.outputs.cluster }}
          wait-for-service-stability: true
          wait-for-minutes:           20

      - name: Wait for Magento to initialise
        run: |
          echo "Waiting 60s for container entrypoint (setup:upgrade / di:compile)..."
          sleep 60

      - name: Health check — poll until ready
        id: health
        run: |
          URL="${{ needs.resolve-infra.outputs.magento_url }}"
          echo "Health checking ${URL}..."
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 --max-time 15 "${URL}/health" || echo "000")
            echo "Attempt ${i}/20: HTTP ${STATUS}"
            if [ "$STATUS" = "200" ]; then
              echo "healthy=true" >> $GITHUB_OUTPUT
              echo "::notice::Magento is live at ${URL}"
              break
            fi
            if [ "$STATUS" = "302" ] || [ "$STATUS" = "301" ]; then
              echo "healthy=true" >> $GITHUB_OUTPUT
              echo "::notice::Magento redirecting (HTTPS) — probably healthy"
              break
            fi
            sleep 30
          done

      - name: Store deployed version in SSM
        run: |
          aws ssm put-parameter \
            --name "/magento/prod/deployed_version" \
            --value "${{ needs.build.outputs.version }}" \
            --type String --overwrite
          aws ssm put-parameter \
            --name "/sdlc-ai/last_magento_deploy" \
            --value "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --type String --overwrite

      - name: Deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## Magento 2.4.9 Deployment
          | Field | Value |
          |-------|-------|
          | Version | ${{ needs.build.outputs.version }} |
          | Image | ${{ needs.build.outputs.image }} |
          | URL | ${{ needs.resolve-infra.outputs.magento_url }} |
          | Cluster | ${{ needs.resolve-infra.outputs.cluster }} |
          | Service | ${{ needs.resolve-infra.outputs.service }} |
          | Commit | ${{ github.sha }} |
          | Triggered by | ${{ github.actor }} |
          SUMMARY

  # ── 4. Playwright smoke tests ─────────────────────────────────────────────
  smoke-test:
    name: Post-Deploy Playwright Smoke Tests
    runs-on: ubuntu-latest
    needs: [resolve-infra, deploy]
    if: ${{ !inputs.skip_tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playwright/package-lock.json

      - name: Install Playwright and browsers
        working-directory: playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Run Playwright smoke tests
        working-directory: playwright
        env:
          BASE_URL:               ${{ needs.resolve-infra.outputs.magento_url }}
          MAGENTO_ADMIN_USER:     ${{ secrets.MAGENTO_ADMIN_USER }}
          MAGENTO_ADMIN_PASS:     ${{ secrets.MAGENTO_ADMIN_PASS }}
          MAGENTO_CUSTOMER_EMAIL: ${{ secrets.MAGENTO_CUSTOMER_EMAIL }}
          MAGENTO_CUSTOMER_PASS:  ${{ secrets.MAGENTO_CUSTOMER_PASS }}
          CI: 'true'
        run: npx playwright test --grep "@smoke" || true

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.run_id }}
          path: playwright/playwright-report/
          retention-days: 14

      - name: Publish smoke report to S3
        if: always()
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name "/sdlc-ai/playwright_report_bucket" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -n "$BUCKET" ]; then
            aws s3 sync playwright/playwright-report/ \
              "s3://${BUCKET}/smoke/${{ github.run_id }}/" --delete
            echo "::notice::Report: http://${BUCKET}.s3-website-${{ env.AWS_REGION }}.amazonaws.com/smoke/${{ github.run_id }}/index.html"
          fi
