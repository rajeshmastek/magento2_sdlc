name: Playwright Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'playwright/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Magento base URL to test against'
        required: false
        default: ''
      test_filter:
        description: 'Test file pattern filter (e.g. WarrantyPeriod)'
        required: false
        default: ''

env:
  NODE_VERSION: '20'

jobs:
  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js setup ────────────────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: playwright/package-lock.json

      # ── Install dependencies ─────────────────────────────────────────────────
      - name: Install Playwright dependencies
        working-directory: playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # ── Configure AWS credentials ────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION || 'us-east-1' }}

      # ── Get Magento URL from AWS SSM ─────────────────────────────────────────
      - name: Get Magento application URL
        id: get-url
        run: |
          if [ -n "${{ github.event.inputs.base_url }}" ]; then
            echo "BASE_URL=${{ github.event.inputs.base_url }}" >> $GITHUB_ENV
          else
            # Fetch from AWS SSM Parameter Store
            BASE_URL=$(aws ssm get-parameter \
              --name "/magento/prod/base_url" \
              --with-decryption \
              --query "Parameter.Value" \
              --output text 2>/dev/null || echo "${{ secrets.MAGENTO_BASE_URL }}")
            echo "BASE_URL=${BASE_URL}" >> $GITHUB_ENV
          fi
          echo "Testing against: ${BASE_URL}"

      # ── Create test results directory ────────────────────────────────────────
      - name: Prepare test directories
        working-directory: playwright
        run: |
          mkdir -p test-results/.auth
          mkdir -p test-results/artifacts
          mkdir -p playwright-report

      # ── Run Playwright tests ─────────────────────────────────────────────────
      - name: Run Playwright tests
        working-directory: playwright
        env:
          BASE_URL:                ${{ env.BASE_URL }}
          MAGENTO_ADMIN_USER:      ${{ secrets.MAGENTO_ADMIN_USER }}
          MAGENTO_ADMIN_PASS:      ${{ secrets.MAGENTO_ADMIN_PASS }}
          MAGENTO_CUSTOMER_EMAIL:  ${{ secrets.MAGENTO_CUSTOMER_EMAIL }}
          MAGENTO_CUSTOMER_PASS:   ${{ secrets.MAGENTO_CUSTOMER_PASS }}
          CI:                      'true'
        run: |
          FILTER="${{ github.event.inputs.test_filter }}"
          if [ -n "$FILTER" ]; then
            npx playwright test --grep "$FILTER" || true
          else
            npx playwright test || true
          fi

      # ── Upload test results ──────────────────────────────────────────────────
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright/playwright-report/
          retention-days: 30

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: playwright/test-results/
          retention-days: 14

      # ── Publish test report to S3 ────────────────────────────────────────────
      - name: Publish report to S3
        if: always()
        run: |
          REPORT_BUCKET=$(aws ssm get-parameter \
            --name "/sdlc-ai/playwright_report_bucket" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -n "$REPORT_BUCKET" ]; then
            RUN_ID="${{ github.run_id }}"
            aws s3 sync playwright/playwright-report/ \
              "s3://${REPORT_BUCKET}/reports/${RUN_ID}/" \
              --content-type "text/html" --delete
            aws s3 cp playwright/test-results/results.json \
              "s3://${REPORT_BUCKET}/results/${RUN_ID}.json" || true
            echo "Report published: https://${REPORT_BUCKET}.s3.amazonaws.com/reports/${RUN_ID}/index.html"
          fi

      # ── Post results to SDLC platform ────────────────────────────────────────
      - name: Post test results to SDLC AI Platform
        if: always()
        run: |
          SDLC_API=$(aws ssm get-parameter \
            --name "/sdlc-ai/api_url" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -n "$SDLC_API" ] && [ -f "playwright/test-results/results.json" ]; then
            RESULTS=$(cat playwright/test-results/results.json)
            curl -s -X POST "${SDLC_API}/playwright/results" \
              -H "Content-Type: application/json" \
              -d "{
                \"run_id\": \"${{ github.run_id }}\",
                \"commit\": \"${{ github.sha }}\",
                \"branch\": \"${{ github.ref_name }}\",
                \"results\": ${RESULTS},
                \"report_url\": \"https://${REPORT_BUCKET}.s3.amazonaws.com/reports/${{ github.run_id }}/index.html\"
              }" || true
          fi

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Test results summary
        if: always()
        working-directory: playwright
        run: |
          if [ ! -f "test-results/results.json" ]; then
            echo "No results file" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          PASSED=$(python3 -c "import json; r=json.load(open('test-results/results.json')); \
            def c(s,a): \
              [a.update({t.get('status'):a.get(t.get('status'),0)+1}) for sp in s.get('specs',[]) for t in sp.get('tests',[])];\
              [c(ch,a) for ch in s.get('suites',[])] \
            ; a={}; [c(s,a) for s in r.get('suites',[])];\
            print(a.get('expected',0),a.get('unexpected',0)+a.get('failed',0),a.get('skipped',0))")
          read PASS FAIL SKIP <<< "$PASSED"
          TOTAL=$((PASS + FAIL + SKIP))
          echo "## Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed  | $PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed  | $FAIL |" >> $GITHUB_STEP_SUMMARY
          echo "| Skipped | $SKIP |" >> $GITHUB_STEP_SUMMARY
          echo "| Total   | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL" -gt "0" ]; then
            echo "::error::$FAIL Playwright test(s) failed"
            exit 1
          fi
